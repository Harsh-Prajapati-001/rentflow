# .github/workflows/whatsapp-notifier.yml
# Runs every day at 8:00 AM IST (2:30 AM UTC)
# Also runs at 8:00 PM IST (2:30 PM UTC) for evening reminder pass

name: WhatsApp Rent Notifier

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC
    - cron: '30 2 * * *'
    # 8:00 PM IST = 2:30 PM UTC  (second daily pass)
    - cron: '30 14 * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no messages sent)'
        required: false
        default: 'false'
        type: boolean

jobs:
  notify:
    name: Send WhatsApp Reminders
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scheduler/package.json

      # Install Chromium dependencies for puppeteer/whatsapp-web.js
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium-browser \
            libgbm-dev \
            libasound2 \
            libatk1.0-0 \
            libc6 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libexpat1 \
            libfontconfig1 \
            libgcc1 \
            libgconf-2-4 \
            libgdk-pixbuf2.0-0 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libstdc++6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrandr2 \
            libxrender1 \
            libxss1 \
            libxtst6 \
            ca-certificates \
            fonts-liberation \
            libappindicator1 \
            libnss3 \
            lsb-release \
            xdg-utils \
            wget

      - name: Install scheduler dependencies
        working-directory: scheduler
        run: npm install

      - name: Run WhatsApp Notifier
        working-directory: scheduler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WA_SESSION_DATA: ${{ secrets.WA_SESSION_DATA }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
        run: npm start

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-logs-${{ github.run_id }}
          path: scheduler/*.log
          retention-days: 7
