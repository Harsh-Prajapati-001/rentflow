# .github/workflows/whatsapp-notifier.yml
# Runs every day at 8:00 AM IST (2:30 AM UTC)
# Also runs at 8:00 PM IST (2:30 PM UTC) for evening reminder pass

name: WhatsApp Rent Notifier

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC
    - cron: '30 2 * * *'
    # 8:00 PM IST = 2:30 PM UTC  (second daily pass)
    - cron: '30 14 * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  notify:
    name: Send WhatsApp Reminders
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scheduler/package.json

      - name: Install scheduler dependencies
        working-directory: scheduler
        run: npm install

      - name: Run WhatsApp Notifier
        working-directory: scheduler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
        run: npm start

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-logs-${{ github.run_id }}
          path: scheduler/*.log
          retention-days: 7
