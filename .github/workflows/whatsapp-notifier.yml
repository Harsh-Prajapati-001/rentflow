# .github/workflows/whatsapp-notifier.yml
# Triggers the Supabase Edge Function to send Twilio WhatsApp reminders

name: WhatsApp Rent Notifier

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  notify:
    name: Trigger WhatsApp Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call Edge Function
        run: |
          curl -s -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/whatsapp-notifier" \
            -H "Authorization: Bearer ${{ secrets.FUNCTION_SECRET }}" \
            -H "Content-Type: application/json"
          
          echo "✅ WhatsApp notifier function triggered"