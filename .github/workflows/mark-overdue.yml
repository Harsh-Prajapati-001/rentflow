# .github/workflows/mark-overdue.yml
#
# FIX: Gemini Issue #3 — Wrong RPC function name
# The old workflow called /rpc/mark_overdue_rents which does not exist.
# The correct function is run_daily_overdue_check() which:
#   - marks unpaid rent records as overdue
#   - marks unpaid electricity records as overdue
#   - sends day-count in-app notifications (1 day overdue, 2 days overdue...)
#
# Runs every day at 12:30 AM IST (7:00 PM UTC previous day)

name: Daily Overdue Check

on:
  schedule:
    # 12:30 AM IST = 7:00 PM UTC
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  run-overdue-check:
    name: Mark overdue records + send day-count notifications
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call run_daily_overdue_check via Supabase RPC
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/run_daily_overdue_check" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

          echo "Response body: $BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ RPC call failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Daily overdue check completed successfully"
          echo "$BODY"
